<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Figtree', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(180, 130, 90, 0.35); border-radius: 8px; }
  .dark ::-webkit-scrollbar-thumb { background: rgba(230, 190, 140, 0.2); }

  .chord-line, .lyric-line { white-space: pre; font-family: 'Menlo','Consolas',monospace; line-height: 1.6; }
  .chord-token { color: #AE5F51; font-weight: 700; }
  .dark .chord-token { color: #E7B489; }
  .lyric-line { color: inherit; }

  .modal-backdrop { background: rgba(42, 33, 28, 0.45); backdrop-filter: blur(2px); }
  .dark .modal-backdrop { background: rgba(10, 7, 5, 0.65); }

  .chip { transition: all .15s ease; }
  .tab-btn { opacity: .5; }
  .tab-btn.active { border-bottom-color: currentColor; opacity: 1; }

  input[type=range].slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 999px;
    background: #AE5F51; cursor: pointer; margin-top: -6px;
  }
  input[type=range].slider { -webkit-appearance: none; height: 4px; border-radius: 999px; background: #E7B75B; }
  .dark input[type=range].slider { background: #6B5642; }
  .dark input[type=range].slider::-webkit-slider-thumb { background: #E7B489; }

  @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:translateY(0);} }
  .fade-in { animation: fadeIn .18s ease-out; }
  @keyframes pulseRing { 0%{box-shadow:0 0 0 0 rgba(174,95,81,.45);} 70%{box-shadow:0 0 0 8px rgba(174,95,81,0);} 100%{box-shadow:0 0 0 0 rgba(174,95,81,0);} }
  .sync-btn { animation: pulseRing 2.4s infinite; }

  .logo-img { object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,.12)); background: white; border-radius: 10px; padding: 3px; }
  .cat-badge { font-size: 10px; line-height: 1; }
  .song-card { transition: transform .12s ease, box-shadow .12s ease; }
  .song-card:hover { transform: translateY(-2px); }

  #sidebar { transition: transform .22s ease, width .22s ease, opacity .22s ease; }
  @media (min-width: 768px) {
    #sidebar.collapsed-desktop { width: 0; opacity: 0; pointer-events: none; border: 0; }
  }

  .nav-arrow { transition: opacity .15s ease, transform .1s ease; }
  .nav-arrow:active { transform: scale(0.92); }
  .nav-arrow[disabled] { opacity: 0.25; pointer-events: none; }
</style>
</head>

/* ============================================================
   UTILIDADES DE ACORDES (notacion americana)
   ============================================================ */
const NOTES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_TO_SHARP = { Db:'C#', Eb:'D#', Gb:'F#', Ab:'G#', Bb:'A#' };
const CHORD_TOKEN_RE = /^([A-G](?:#|b)?)((?:maj|min|sus|dim|aug|add|m)?\d{0,2}\+?)(?:\/([A-G](?:#|b)?))?$/i;

function normalizeNote(n) {
  n = n[0].toUpperCase() + n.slice(1);
  return FLAT_TO_SHARP[n] || n;
}
function shiftNote(note, semitones) {
  const norm = normalizeNote(note);
  const idx = NOTES_SHARP.indexOf(norm);
  if (idx === -1) return note;
  const newIdx = ((idx + semitones) % 12 + 12) % 12;
  return NOTES_SHARP[newIdx];
}
function isChordLine(line) {
  const tokens = line.trim().split(/\s+/).filter(Boolean);
  if (tokens.length === 0) return false;
  return tokens.every(t => CHORD_TOKEN_RE.test(t));
}
function transposeChordLine(line, semitones) {
  if (semitones === 0) return line;
  return line.replace(/\S+/g, tok => {
    const m = tok.match(CHORD_TOKEN_RE);
    if (!m) return tok;
    const [, root, quality, bass] = m;
    let out = shiftNote(root, semitones) + (quality || '');
    if (bass) out += '/' + shiftNote(bass, semitones);
    return out;
  });
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function detectOriginalRoot(song) {
  if (!song || !song.content) return null;
  const lines = song.content.split('\n');
  for (const line of lines) {
    if (isChordLine(line)) {
      const tokens = line.trim().split(/\s+/).filter(Boolean);
      const m = tokens[0].match(CHORD_TOKEN_RE);
      if (m) return normalizeNote(m[1]);
    }
  }
  return null;
}
function shortestOffset(from, to) {
  const iFrom = NOTES_SHARP.indexOf(from), iTo = NOTES_SHARP.indexOf(to);
  if (iFrom === -1 || iTo === -1) return 0;
  let off = ((iTo - iFrom) % 12 + 12) % 12;
  if (off > 6) off -= 12;
  return off;
}
function normalizeRepertoire(rep) {
  if (!rep.songs) {
    rep.songs = (rep.songIds || []).map(id => ({ id, transpose: 0 }));
  }
  rep.songs = rep.songs.map(s => typeof s === 'string' ? { id: s, transpose: 0 } : { id: s.id, transpose: s.transpose || 0 });
  delete rep.songIds;
  if (!rep.mode) rep.mode = 'original';
  if (rep.uniformKey === undefined) rep.uniformKey = 'C';
  return rep;
}
function renderSongContent(content, semitones) {
  return content.split('\n').map(line => {
    if (line.trim() === '') return '<div class="lyric-line">&nbsp;</div>';
    if (isChordLine(line)) {
      const transposed = transposeChordLine(line, semitones);
      const escaped = escapeHtml(transposed);
      const html = escaped.replace(/\S+/g, m => `<span class="chord-token">${m}</span>`);
      return `<div class="chord-line">${html}</div>`;
    }
    return `<div class="lyric-line">${escapeHtml(line)}</div>`;
  }).join('');
}

/* ============================================================

   ============================================================ */
const UI = {

  init() {
    if (State.data.settings.theme === 'dark') document.documentElement.classList.add('dark');
    this.updateThemeBtn();
    this.applyLogo();
    if (State.data.settings.sidebarCollapsed) {
      document.getElementById('sidebar').classList.add('collapsed-desktop');
    }
    State.data.repertoires = (State.data.repertoires || []).map(normalizeRepertoire);
    this.renderCategoryChips();
    this.setFavFilter(false);

    document.getElementById('scrollSpeed').addEventListener('input', () => {
      if (State.autoScrollTimer) { this.toggleAutoScroll(); this.toggleAutoScroll(); }
    });

    document.addEventListener('keydown', (e) => {
      if (State.currentView !== 'reader') return;
      if (document.getElementById('modalRoot').innerHTML.trim() !== '') return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') this.nextSong();
      if (e.key === 'ArrowLeft') this.prevSong();
    });

    const scrollArea = document.getElementById('scrollArea');
    scrollArea.addEventListener('touchstart', (e) => {
      State.touchStartX = e.touches[0].clientX;
      State.touchStartY = e.touches[0].clientY;
    }, { passive: true });
    scrollArea.addEventListener('touchend', (e) => {
      if (State.touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - State.touchStartX;
      const dy = e.changedTouches[0].clientY - State.touchStartY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {

  openReaderFromContext(id) {
    State.currentList = this.getFilteredSongs().map(s => s.id);

  },
  openReaderAt(index, list) {
    if (list) State.currentList = list;
    if (index < 0 || index >= State.currentList.length) return;
    State.currentIndex = index;
    const id = State.currentList[index];
    const song = State.data.songs.find(s => s.id === id);
    if (!song) return;
    State.currentView = 'reader';
    State.currentSongId = id;
    const baseline = (State.contextTransposeMap && typeof State.contextTransposeMap[id] === 'number') ? State.contextTransposeMap[id] : 0;
    if (State.keyLock.active) {
      const orig = detectOriginalRoot(song);
      State.currentTranspose = (orig && State.keyLock.root) ? shortestOffset(orig, State.keyLock.root) : State.keyLock.fallbackTranspose;
    } else {
      State.currentTranspose = baseline;

    document.getElementById('listView').classList.add('hidden');

  transpose(delta) {
    if (State.isGuest) return;
    State.currentTranspose += delta;
    if (State.keyLock.active) {
      const song = State.data.songs.find(s => s.id === State.currentSongId);
      const orig = song ? detectOriginalRoot(song) : null;
      State.keyLock.root = orig ? shiftNote(orig, State.currentTranspose) : null;
      State.keyLock.fallbackTranspose = State.currentTranspose;
    } else {
      State.contextTransposeMap[State.currentSongId] = State.currentTranspose;
      if (State.currentRepertoireId) {
        const rep = State.data.repertoires.find(r => r.id === State.currentRepertoireId);
        if (rep) {
          const entry = rep.songs.find(s => s.id === State.currentSongId);
          if (entry) { entry.transpose = State.currentTranspose; persist(); }
        }
      }
    }
    this.renderReader();
    Sync.broadcastSong();
  },
  toggleKeyLock() {
    if (State.isGuest) return;
    const song = State.data.songs.find(s => s.id === State.currentSongId);
    if (!State.keyLock.active) {
      const orig = song ? detectOriginalRoot(song) : null;
      State.keyLock = {
        active: true,
        root: orig ? shiftNote(orig, State.currentTranspose) : null,
        fallbackTranspose: State.currentTranspose
      };
    } else {
      State.keyLock = { active: false, root: null, fallbackTranspose: 0 };
      const baseline = (State.contextTransposeMap && typeof State.contextTransposeMap[State.currentSongId] === 'number') ? State.contextTransposeMap[State.currentSongId] : 0;
      State.currentTranspose = baseline;

/* ============================================================
   SINCRONIZACION P2P (PeerJS)
   ============================================================ */
const ROOM_PREFIX = 'cancionero-rccarica-';
function generateRoomCode() {
  return String(Math.floor(100000 + Math.random() * 900000)); // 6 dÃ­gitos
}
function friendlyPeerError(err) {
  const map = {
    'peer-unavailable': 'No se encontrÃ³ esa sala. Verifica que el cÃ³digo estÃ© bien escrito y que el anfitriÃ³n ya haya iniciado la sala.',
    'network': 'Problema de conexiÃ³n a internet. Revisa tu red e intÃ©ntalo de nuevo.',
    'server-error': 'No se pudo conectar al servidor de sincronizaciÃ³n. Espera unos segundos e intÃ©ntalo de nuevo.',
    'socket-error': 'No se pudo conectar al servidor de sincronizaciÃ³n. Espera unos segundos e intÃ©ntalo de nuevo.',
    'socket-closed': 'Se perdiÃ³ la conexiÃ³n con el servidor. Vuelve a intentarlo.',
    'browser-incompatible': 'Este navegador no soporta la sincronizaciÃ³n en vivo. Prueba con Chrome o Safari actualizado.',
    'disconnected': 'Se perdiÃ³ la conexiÃ³n. Vuelve a intentarlo.',
  };
  return map[err.type] || `No se pudo conectar (${err.type}). Revisa tu conexiÃ³n a internet e intÃ©ntalo de nuevo.`;
}

const Sync = {
  startHost(attempt) {
    attempt = attempt || 1;
    State.isGuest = false;
    const code = generateRoomCode();
    const statusBox = document.getElementById('hostStatus');
    statusBox.innerHTML = 'Generando cÃ³digo de sala...';
    if (State.peer && !State.peer.destroyed) { try { State.peer.destroy(); } catch(e) {} }
    State.peer = new Peer(ROOM_PREFIX + code);
    State.peer.on('open', () => {
      statusBox.innerHTML = `
        <div class="bg-amber-100/60 dark:bg-white/5 rounded-xl p-3 mb-2 text-center">
          <p class="text-xs text-ink/50 dark:text-cream-100/40 mb-1">CÃ³digo de sala:</p>
          <p class="font-mono text-3xl font-bold tracking-[0.2em] mb-2">${code}</p>
          <button onclick="Sync.copyCode('${code}')" class="text-xs bg-coral-400 hover:bg-coral-500 text-white px-3 py-1.5 rounded-lg font-medium">ðŸ“‹ Copiar cÃ³digo</button>
        </div>
        <p id="guestCount" class="text-xs text-ink/50 dark:text-cream-100/40 text-center">0 invitado(s) conectado(s)</p>`;
    });
    State.peer.on('connection', conn => {
      State.guestConns.push(conn);
      conn.on('open', () => {
        document.getElementById('guestCount') && (document.getElementById('guestCount').textContent = `${State.guestConns.length} invitado(s) conectado(s)`);
        this.broadcastSong();
      });
      conn.on('close', () => { State.guestConns = State.guestConns.filter(c => c !== conn); });
    });
    State.peer.on('error', err => {
      if (err.type === 'unavailable-id' && attempt < 5) {
        this.startHost(attempt + 1);
        return;
      }
      statusBox.innerHTML = `<p class="text-coral-500">${friendlyPeerError(err)}</p>
        <button onclick="Sync.startHost()" class="mt-2 text-xs bg-amber-100 dark:bg-white/10 px-3 py-1.5 rounded-lg font-medium">Reintentar</button>`;
    });
  },
  copyCode(code) {
    navigator.clipboard && navigator.clipboard.writeText(code).catch(() => {});
  },
  broadcastSong() {
    if (!State.guestConns.length || State.isGuest || !State.currentSongId) return;
    const payload = { type: 'song', id: State.currentSongId, transpose: State.currentTranspose, list: State.currentList, index: State.currentIndex, label: State.contextLabel };
    State.guestConns.forEach(c => { if (c.open) c.send(payload); });
  },
  joinAsGuest() {
    const raw = document.getElementById('guestCodeInput').value.trim();
    const code = raw.replace(/\D/g, '');
    if (!code) { document.getElementById('guestStatus').innerHTML = '<p class="text-coral-500">Ingresa el cÃ³digo de 6 dÃ­gitos.</p>'; return; }
    const statusBox = document.getElementById('guestStatus');
    statusBox.textContent = 'Conectando...';
    if (State.peer && !State.peer.destroyed) { try { State.peer.destroy(); } catch(e) {} }
    State.peer = new Peer();
    State.peer.on('open', () => {
      const conn = State.peer.connect(ROOM_PREFIX + code);
      State.hostConn = conn;
      let opened = false;
      conn.on('open', () => {
        opened = true;
        State.isGuest = true;
        statusBox.innerHTML = '<p class="text-coral-500 font-medium">âœ“ Conectado. Tu pantalla seguirÃ¡ al anfitriÃ³n.</p>';
        setTimeout(() => UI.closeModal(), 900);
      });
      conn.on('data', data => {
        if (data.type === 'song') {
          const exists = State.data.songs.find(s => s.id === data.id);
          if (!exists) return;
          State.contextLabel = data.label || State.contextLabel;
          State.currentList = data.list && data.list.length ? data.list : [data.id];
          const idx = typeof data.index === 'number' && data.index >= 0 ? data.index : State.currentList.indexOf(data.id);
          UI.openReaderAt(idx, State.currentList);
          State.currentTranspose = data.transpose || 0;
          UI.renderReader();
        }
      });
      conn.on('error', () => { statusBox.innerHTML = '<p class="text-coral-500">No se pudo conectar. Verifica el cÃ³digo con el anfitriÃ³n.</p>'; });
      setTimeout(() => {
        if (!opened) statusBox.innerHTML = '<p class="text-coral-500">No se encontrÃ³ esa sala. Verifica el cÃ³digo o pide al anfitriÃ³n que la vuelva a generar.</p>';
      }, 8000);
    });
    State.peer.on('error', err => { statusBox.innerHTML = `<p class="text-coral-500">${friendlyPeerError(err)}</p>`; });
  }
};


UI.init();
</script>
